# fly.toml - Fly.io configuration

app = "vocabulary-quiz-python"
primary_region = "fra"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "vocab_data"
  destination = "/data"
