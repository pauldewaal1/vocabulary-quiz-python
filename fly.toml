app = 'vocabulary-quiz-python-pg86ua'
primary_region = 'fra'

[build]
[[mounts]]
  source = 'vocab_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
